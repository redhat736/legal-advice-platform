<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Backend API Base URL - Universal Cloud, Netlify & Local Resolution
    const API_BASE = (() => {
      if (typeof window === 'undefined') return '/api';
      if (window.location.protocol === 'file:') return 'http://localhost:5000/api';
      // When deployed on Netlify (static hosting), automatically route API calls to live Render backend
      if (window.location.hostname.includes('netlify.app')) {
        return 'https://legal-advice-platform-cfdo.onrender.com/api';
      }
      return '/api';
    })();

    // Helper for authenticated backend API requests
    const apiCall = async (endpoint, options = {}) => {
      const token = localStorage.getItem('LA_JWT_TOKEN');
      const headers = {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
        ...(options.headers || {})
      };
      try {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers
        });
        const data = await res.json();
        return data;
      } catch (err) {
        console.warn(`[Backend API connection on ${endpoint}]:`, err.message);
        return null;
      }
    };

    // Web Audio Synthesized WhatsApp Chime
    const playWhatsAppChime = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(700, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.20);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.20);
      } catch (e) {}
    };

    // Storage Keys
    const STORAGE_KEY_AUTH = 'LA_AUTH_USER_V7';
    const STORAGE_KEY_GEMINI = 'LA_GEMINI_API_KEY';

    const DEFAULT_CATEGORIES = [
      {
        slug: 'criminal-law',
        title: 'Criminal Law & Bail',
        shortDesc: 'Anticipatory bail, trial defense, FIR quashing, and white-collar defense.',
        fullDesc: 'Facing criminal proceedings requires immediate constitutional protection. Our criminal advocates appear before Magistrate courts, High Courts, and Supreme Court.',
        services: ['Anticipatory & Regular Bail', 'Section 482 Quashing', 'Cheque Bounce (Sec 138)', 'Cybercrime & Fraud', 'Appeals & Revisions'],
        icon: '⚖️'
      },
      {
        slug: 'business-law',
        title: 'Corporate & Business Law',
        shortDesc: 'Contract drafting, company incorporation, founder agreements, and M&A.',
        fullDesc: 'From early-stage entity structuring to complex enterprise litigation and mergers, we protect high-value business assets and enforce stakeholder agreements.',
        services: ['Founders Agreement', 'Term Sheet & Shareholder Pacts', 'Vendor Arbitration', 'Trademark & IP Filing', 'Regulatory Compliance'],
        icon: '📑'
      },
      {
        slug: 'family-law',
        title: 'Family & Matrimonial Law',
        shortDesc: 'Mutual consent divorce, child custody, maintenance alimony, and adoption.',
        fullDesc: 'Sensitive resolution of matrimonial disputes prioritizing confidentiality, fair child welfare maintenance, and amicable settlement decrees.',
        services: ['Mutual Consent Divorce', 'Child Custody & Visitation', 'Alimony Settlement', 'Domestic Violence Relief', 'Restitution of Conjugal Rights'],
        icon: '👨‍👩‍👧'
      },
      {
        slug: 'real-estate-law',
        title: 'Real Estate & Property',
        shortDesc: 'Title verification, builder delay (RERA), tenancy disputes, and sale deed review.',
        fullDesc: 'Due diligence on land titles, registry compliance, lease negotiation, and filing consumer / RERA complaints against delayed possession.',
        services: ['RERA Compensation Claims', 'Title Search & Encumbrance Check', 'Commercial Lease Agreements', 'Partition & Mutation Suits', 'Eviction Petitions'],
        icon: '🏢'
      },
      {
        slug: 'employment-law',
        title: 'Employment & Labor Law',
        shortDesc: 'Wrongful termination, workplace harassment, unpaid dues, and severance review.',
        fullDesc: 'Representation before Labor Commissioner, Industrial Tribunals, and High Court in employment contract violations and disciplinary inquiries.',
        services: ['Wrongful Termination', 'Severance Package Review', 'POSH Act Compliance', 'Gratuity & PF Recovery', 'Non-Compete Enforceability'],
        icon: '💼'
      },
      {
        slug: 'personal-injury-law',
        title: 'Personal Injury & Motor Accident',
        shortDesc: 'MACT claims, medical negligence compensation, and workplace accidents.',
        fullDesc: 'Securing fair financial compensation from insurance firms and negligent parties for grievous injuries, hospital expenses, and lifetime disability support.',
        services: ['MACT Tribunal Petitions', 'Medical Negligence Cases', 'Insurance Claim Litigation', 'Third-Party Liability Claims', 'Permanent Disability Settlement'],
        icon: '🏥'
      }
    ];

    const DEFAULT_CASES = [
      {
        id: 'case-demo-1',
        title: 'Urgent Anticipatory Bail Petition - Delhi High Court',
        category_slug: 'criminal-law',
        client_id: 'client-demo-1',
        client_name: 'Alexander Wright',
        lawyer_id: 'lawyer-rahul',
        lawyer_name: 'Adv. Rahul Rawat',
        status: 'In Review',
        priority: 'High',
        description: 'Anticipatory bail petition filed under Section 438 CrPC regarding corporate transaction dispute and impending summons.',
        created_at: '2026-11-03'
      }
    ];

    const DEFAULT_DOCUMENTS = [
      {
        id: 'doc-1',
        name: 'FIR_Copy_Notice_Annexure_A.pdf',
        size: '1.4 MB',
        mime_type: 'PDF',
        user_id: 'client-demo-1',
        case_id: 'case-demo-1',
        created_at: '2026-11-03'
      }
    ];

    // =========================================================================
    // MAIN APPLICATION COMPONENT
    // =========================================================================
    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY_AUTH);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      });

      const [currentTab, setCurrentTab] = useState('dashboard');
      const [lawyers, setLawyers] = useState([]);
      const [cases, setCases] = useState(DEFAULT_CASES);
      const [documents, setDocuments] = useState(DEFAULT_DOCUMENTS);

      // Chat State
      const [chats, setChats] = useState([]);
      const [activeChatId, setActiveChatId] = useState(null);
      const [activeMessages, setActiveMessages] = useState([]);

      // UI Dropdown & Modals State
      const [profileDropdownOpen, setProfileDropdownOpen] = useState(false);
      const [selectedCatModal, setSelectedCatModal] = useState(null);
      const [fileCaseModalOpen, setFileCaseModalOpen] = useState(false);
      const [notificationToast, setNotificationToast] = useState(null);
      const notifTimerRef = useRef(null);
      const [profileModalOpen, setProfileModalOpen] = useState(false);
      const [viewProfileUser, setViewProfileUser] = useState(null);
      const [isSendingMsg, setIsSendingMsg] = useState(false);

      // Ref to track last seen message count for audio chime
      const lastMessageCountRef = useRef(0);
      const dropdownRef = useRef(null);

      // Close profile dropdown when clicking outside
      useEffect(() => {
        const handleClickOutside = (event) => {
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
            setProfileDropdownOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      // Save currentUser to localStorage
      useEffect(() => {
        try {
          if (currentUser) {
            localStorage.setItem(STORAGE_KEY_AUTH, JSON.stringify(currentUser));
          } else {
            localStorage.removeItem(STORAGE_KEY_AUTH);
            localStorage.removeItem('LA_JWT_TOKEN');
          }
        } catch (e) {}
      }, [currentUser]);

      // 1. Fetch Dynamic Verified Advocates from Backend Database
      const loadLawyers = async () => {
        try {
          const data = await apiCall('/agents?include_inactive=true');
          if (data && data.success && Array.isArray(data.lawyers)) {
            setLawyers(data.lawyers.map(l => ({
              id: l.user_id || l.id,
              user_id: l.user_id || l.id,
              name: l.name,
              email: l.email,
              role: 'lawyer',
              licenseNo: l.license_no || l.licenseNo || 'Verified Bar License',
              court: l.court || 'High Court of Delhi & Supreme Court',
              area_of_expertise: l.area_of_expertise || 'Criminal Law & General Counsel',
              experience_years: l.experience_years || 8,
              hourly_rate: l.hourly_rate || 2000,
              currency: l.currency || '₹',
              rating: l.rating || 4.90,
              is_available: l.is_available === true || l.is_available === 'true',
              avatar_url: l.avatar_url || 'https://images.unsplash.com/photo-1556157382-97eda2d62296?auto=format&fit=crop&q=80&w=300',
              achievements: l.achievements || '',
              bio: l.bio || ''
            })));

            if (currentUser && currentUser.role === 'lawyer') {
              const currentLawyer = data.lawyers.find(l => (l.user_id === currentUser.id || l.id === currentUser.id || l.email === currentUser.email));
              if (currentLawyer) {
                const updatedAvail = currentLawyer.is_available === true || currentLawyer.is_available === 'true';
                if (currentUser.is_available !== updatedAvail) {
                  setCurrentUser(prev => ({ ...prev, is_available: updatedAvail }));
                }
              }
            }
          }
        } catch (e) {}
      };

      // 2. Fetch User's Active Chat Sessions from Backend
      const loadSessions = async () => {
        if (!currentUser) return;
        try {
          const res = await apiCall('/chat/sessions');
          if (res && res.success && Array.isArray(res.sessions)) {
            const formatted = res.sessions.map(s => {
              const isClient = currentUser.role === 'client';
              const partnerName = isClient ? s.lawyer_name : s.client_name;
              const partnerAvatar = isClient 
                ? (s.lawyer_avatar || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(s.lawyer_name || 'Advocate')}&backgroundColor=1e293b`)
                : (s.client_avatar || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(s.client_name || 'Client')}&backgroundColor=075e54,1c2541,2563eb,d97706,475569`);
              const partnerBio = isClient 
                ? (s.lawyer_bio || 'Admitted advocate with trial standing') 
                : (s.client_bio || 'Petitioner Client');
              const partnerRole = isClient ? 'lawyer' : 'client';
              const partnerCourt = s.lawyer_court || 'High Court of Delhi';
              const partnerLicense = s.lawyer_license || '';
              const partnerExperience = s.lawyer_experience || 5;
              const partnerArea = s.area_of_expertise || 'General Legal Counsel';

              return {
                id: s.id,
                client_id: s.client_id,
                client_name: s.client_name,
                client_avatar: s.client_avatar,
                client_bio: s.client_bio,
                lawyer_id: s.lawyer_id,
                lawyer_name: s.lawyer_name,
                lawyer_avatar: s.lawyer_avatar,
                lawyer_bio: s.lawyer_bio,
                partnerName,
                partnerAvatar,
                partnerBio,
                partnerRole,
                partnerCourt,
                partnerLicense,
                partnerExperience,
                partnerArea,
                lawyer_court: partnerCourt,
                lastMessage: s.last_message || 'No messages yet.',
                lastTime: s.last_message_time ? new Date(s.last_message_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Recently',
                status: s.status || 'Active'
              };
            });

            setChats(formatted);

            if (!activeChatId && formatted.length > 0) {
              setActiveChatId(formatted[0].id);
            }
          }
        } catch (e) {}
      };

      // 3. Fetch Messages for Current Active Session (Permanent Cache + Stable Sync)
      const loadActiveMessages = async (sessionId, triggerChime = false) => {
        if (!sessionId || !currentUser) return;
        const cacheKey = `LA_MSGS_${sessionId}`;

        // Step 1: Instant local storage cache restore so old chat is permanently visible
        if (!triggerChime) {
          try {
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
              const parsed = JSON.parse(cached);
              if (Array.isArray(parsed) && parsed.length > 0) {
                setActiveMessages(parsed);
              }
            }
          } catch (e) {}
        }

        try {
          const res = await apiCall(`/chat/sessions/${sessionId}/messages`);
          if (res && res.success && Array.isArray(res.messages)) {
            const msgs = res.messages.map(m => ({
              id: m.id,
              sender_id: m.sender_id,
              sender_name: m.sender_name || 'Counsel',
              sender_role: m.sender_role,
              text: m.message_text,
              time: m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Now'
            }));

            // Step 2: Save to localStorage for permanent offline/reload storage
            try {
              localStorage.setItem(cacheKey, JSON.stringify(msgs));
            } catch (e) {}

            if (triggerChime && msgs.length > lastMessageCountRef.current) {
              const lastMsg = msgs[msgs.length - 1];
              if (lastMsg && lastMsg.sender_id !== currentUser.id) {
                playWhatsAppChime();
                setNotificationToast({
                  title: `💬 New Message from ${lastMsg.sender_name}`,
                  body: lastMsg.text,
                  targetChatId: sessionId
                });
              }
            }

            lastMessageCountRef.current = msgs.length;

            // Step 3: Smart state update - prevent re-rendering if messages haven't changed!
            setActiveMessages(prev => {
              if (prev && prev.length === msgs.length && prev.length > 0) {
                const prevLast = prev[prev.length - 1];
                const newLast = msgs[msgs.length - 1];
                if (prevLast.id === newLast.id && prevLast.text === newLast.text) {
                  return prev; // exact same reference prevents forced scroll jump!
                }
              }
              return msgs;
            });
          }
        } catch (e) {}
      };


      // Auto-dismiss notification quickly (1.5 seconds)
      useEffect(() => {
        if (notificationToast) {
          if (notifTimerRef.current) clearTimeout(notifTimerRef.current);
          notifTimerRef.current = setTimeout(() => setNotificationToast(null), 1500);
        }
        return () => { if (notifTimerRef.current) clearTimeout(notifTimerRef.current); };
      }, [notificationToast]);
      // Initial Mount & Continuous 1.5s Polling for Real-Life WhatsApp Sync
      useEffect(() => {
        loadLawyers();
      }, []);

      useEffect(() => {
        if (!currentUser) return;
        loadSessions();
        if (activeChatId) {
          loadActiveMessages(activeChatId, false);
        }

        const interval = setInterval(() => {
          loadLawyers();
          loadSessions();
          if (activeChatId) {
            loadActiveMessages(activeChatId, true);
          }
        }, 1500);

        return () => clearInterval(interval);
      }, [currentUser?.id, activeChatId]);

      // =======================================================================
      // ADVOCATE ACTIVE / INACTIVE STATUS TOGGLE
      // =======================================================================
      const handleToggleLawyerStatus = async () => {
        if (!currentUser || currentUser.role !== 'lawyer') return;

        const newStatus = !currentUser.is_available;
        setCurrentUser(prev => ({ ...prev, is_available: newStatus }));

        try {
          const res = await apiCall('/agents/toggle-status', { method: 'PATCH' });
          if (res && res.success) {
            setCurrentUser(prev => ({ ...prev, is_available: res.is_available }));
          }
          await loadLawyers();
        } catch (e) {}

        setNotificationToast({
          title: newStatus ? '🟢 Profile Activated' : '⚪ Profile Inactive (Hidden)',
          body: newStatus 
            ? 'Aapki profile ab Personal Agents roster me sabhi clients ko dikhegi!' 
            : 'Aapki profile ab Personal Agents roster se hide kar di gayi hai.'
        });
      };


      // =======================================================================
      // UPDATE PROFILE (name, avatar, etc)
      // =======================================================================
      const handleUpdateProfile = async (updates) => {
        try {
          const res = await apiCall('/auth/profile', {
            method: 'PATCH',
            body: JSON.stringify(updates)
          });
          setCurrentUser(prev => {
            const next = { ...prev, ...updates };
            if (updates.avatar_url && next.role === 'lawyer' && next.profile) {
              next.profile.avatar_url = updates.avatar_url;
            }
            try {
              localStorage.setItem('LA_CURRENT_USER', JSON.stringify(next));
            } catch (e) {}
            return next;
          });
          await loadLawyers();
          await loadSessions();
          setNotificationToast({ title: '✅ Profile Updated!', body: 'Aapki profile aur Personal Agent dossier update ho gayi.' });
        } catch(e) {
          console.error('Profile update failed:', e);
        }
      };
      // =======================================================================
      // AUTHENTICATION HANDLERS
      // =======================================================================
      const handleLogin = async (email, password) => {
        const res = await apiCall('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: email.trim(), password })
        });

        if (res && res.success && res.user && res.token) {
          localStorage.setItem('LA_JWT_TOKEN', res.token);
          const u = {
            ...res.user,
            is_available: res.user.is_available === true || res.user.is_available === 'true'
          };
          setCurrentUser(u);
          setCurrentTab('dashboard');
          await loadLawyers();
          await loadSessions();
        } else {
          throw new Error(res?.error || 'Invalid email or password.');
        }
      };

      const handleGuestLogin = async (role = 'client') => {
        try {
          const res = await apiCall('/auth/guest-login', {
            method: 'POST',
            body: JSON.stringify({ role })
          });

          if (res && res.success && res.user && res.token) {
            localStorage.setItem('LA_JWT_TOKEN', res.token);
            setCurrentUser({
              ...res.user,
              is_available: res.user.is_available === true || res.user.is_available === 'true'
            });
            setCurrentTab('dashboard');
            await loadLawyers();
            await loadSessions();
            setNotificationToast({
              title: `Logged in as Guest ${role === 'lawyer' ? 'Advocate (वकील)' : 'Client'}`,
              body: 'Welcome to Legal Advice chambers!'
            });
          }
        } catch (e) {
          console.error('Guest login failed:', e);
        }
      };

      const handleRegister = async (formData) => {
        const res = await apiCall('/auth/register', {
          method: 'POST',
          body: JSON.stringify(formData)
        });

        if (res && res.success && res.user && res.token) {
          localStorage.setItem('LA_JWT_TOKEN', res.token);
          const u = {
            ...res.user,
            is_available: true
          };
          setCurrentUser(u);
          setCurrentTab('dashboard');
          await loadLawyers();
          await loadSessions();
        } else {
          throw new Error(res?.error || 'Registration failed.');
        }
      };

      const handleLogout = async () => {
        try {
          await apiCall('/auth/logout', { method: 'POST' });
        } catch (e) {}
        localStorage.removeItem('LA_JWT_TOKEN');
        setCurrentUser(null);
        setCurrentTab('dashboard');
        setActiveChatId(null);
        setActiveMessages([]);
        setProfileDropdownOpen(false);
      };

      const handleSwitchUser = async (targetRole) => {
        await handleGuestLogin(targetRole);
      };

      // =======================================================================
      // REAL-LIFE CHAT ACTIONS
      // =======================================================================
      const handleStartOrOpenChat = async (targetLawyer) => {
        if (!currentUser) return;
        setCurrentTab('chat');

        try {
          const res = await apiCall(`/chat/conversation/${targetLawyer.id}`);
          if (res && res.success && res.session) {
            setActiveChatId(res.session.id);
            await loadSessions();
            await loadActiveMessages(res.session.id, false);
          }
        } catch (e) {
          console.error('Failed to initiate conversation:', e);
        }
      };

      const handleSendMessage = async (sessionId, text) => {
        if (!text.trim() || !currentUser || !sessionId || isSendingMsg) return;

        setIsSendingMsg(true);

        const optimisticMsg = {
          id: `temp-${Date.now()}`,
          sender_id: currentUser.id,
          sender_name: currentUser.name,
          sender_role: currentUser.role,
          text: text.trim(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setActiveMessages(prev => [...prev, optimisticMsg]);

        try {
          const res = await apiCall('/chat/messages', {
            method: 'POST',
            body: JSON.stringify({
              session_id: sessionId,
              message_text: text.trim()
            })
          });

          if (res && res.success) {
            await loadActiveMessages(sessionId, false);
            await loadSessions();
          }
        } catch (e) {
          console.error('Failed to deliver message:', e);
        } finally {
          setIsSendingMsg(false);
        }
      };

      // Case and document helpers
      const handleCreateCase = (casePayload) => {
        const newCase = {
          ...casePayload,

        }
      ]);

      const [inputPrompt, setInputPrompt] = useState('');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem(STORAGE_KEY_GEMINI) || '');
      const [keyInput, setKeyInput] = useState(apiKey);

      const handleSaveKey = (e) => {
        e.preventDefault();
        const trimmed = keyInput.trim();
        setApiKey(trimmed);
        if (trimmed) {

        } else {
          localStorage.removeItem(STORAGE_KEY_GEMINI);
        }
        setShowConfig(false);

      const handleSendAI = async (textToSend) => {
        const query = textToSend || inputPrompt;
        if (!query || !query.trim() || isLoading) return;

        const userMsg = { id: `usr-${Date.now()}`, role: 'user', text: query.trim() };
        setMessages(prev => [...prev, userMsg]);
        setInputPrompt('');
        setIsLoading(true);

        try {
          const res = await apiCall('/ai/chat', {
            method: 'POST',
            body: JSON.stringify({
              prompt: query.trim(),
              apiKey: apiKey.trim(),
              history: messages.slice(-6)
            })
          });

          if (res && res.success && res.text) {
            setMessages(prev => [...prev, {
              id: `ai-${Date.now()}`,
              role: 'ai',
              text: res.text,
              source: res.source

            id: `err-${Date.now()}`,

                  Instant Statutory Research, Legal Drafts & Jurisprudence Analysis

              <span>🔑</span>
              <span>{apiKey ? 'API Key Configured' : 'Configure Gemini Key'}</span>

              <div className="flex items-start justify-between pb-3 border-b border-slate-100 mb-4">
                <div>
                  <h4 className="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">
                    <span>🔑</span> Google Gemini API Key Setup (Free)
                  </h4>
                  <p className="text-xs text-slate-500 mt-0.5">

    // =========================================================================
    function RealLifeWhatsAppView({ currentUser, chats, activeChat, activeMessages, allLawyers, onSelectChat, onSendMessage, onStartChatWith, onQuickSwitchUser, onOpenProfile }) {
      const [inputMsg, setInputMsg] = useState('');
      const [filterChat, setFilterChat] = useState('');
      const [mobileShowChat, setMobileShowChat] = useState(false);
      const [filePreview, setFilePreview] = useState(null);
      const [lightboxImg, setLightboxImg] = useState(null);
      const [contactInfoModalOpen, setContactInfoModalOpen] = useState(false);
      const messagesEndRef = useRef(null);
      const messagesContainerRef = useRef(null);
      const fileInputRef = useRef(null);
      const isUserNearBottomRef = useRef(true);
      const currentChatIdRef = useRef(activeChat?.id);

      // Track whether user is reading old messages (scrolled up)
      const handleChatScroll = () => {
        const el = messagesContainerRef.current;
        if (!el) return;
        const distFromBottom = el.scrollHeight - el.scrollTop - el.clientHeight;
        isUserNearBottomRef.current = distFromBottom < 140;
      };

      // Smart scroll: only scroll if user switched chat or was already at the bottom
      useEffect(() => {
        if (activeChat?.id !== currentChatIdRef.current) {
          currentChatIdRef.current = activeChat?.id;
          isUserNearBottomRef.current = true;
          setTimeout(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'auto' });
          }, 30);
          return;
        }

        if (isUserNearBottomRef.current) {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [activeMessages, activeChat?.id]);

      // Send handler: file or text
      const handleSend = (e) => {
        e.preventDefault();
        if (!activeChat) return;
        if (filePreview) {
          const msgText = filePreview.type === 'image'
            ? '[IMG:' + filePreview.name + ']' + filePreview.dataUrl
            : '[DOC:' + filePreview.name + ']' + filePreview.dataUrl;
          onSendMessage(msgText);
          setFilePreview(null);
          setInputMsg('');
          return;
        }
        if (!inputMsg.trim()) return;
        onSendMessage(inputMsg.trim());
        setInputMsg('');
      };

      // Render message text with clickable links
      const renderMsgText = (text) => {
        if (!text) return null;
        const parts = text.split(/(https?:\/\/[^\s<>"]+)/g);
        return parts.map((part, i) =>
          /^https?:\/\//.test(part)
            ? React.createElement('a', { key: i, href: part, target: '_blank', rel: 'noopener noreferrer', className: 'text-blue-600 underline break-all' }, part)
            : React.createElement('span', { key: i }, part)
        );
      };

      // File picker handler
      const handleFilePick = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const isImage = file.type.startsWith('image/');
        const reader = new FileReader();
        reader.onload = (ev) => {

                            ? 'Aapka profile active hai. Sabhi clients aapko Personal Agents list me dekh sakte hain aur chat shuru kar sakte hain.' 
                            : 'Aapka profile inactive hai. Naye clients aapko directory me nahi dekh sakte.'}
                        </p>
                      </div>

                      <button
                        onClick={onToggleStatus}
                        className={`px-4 py-2 rounded-xl text-xs font-extrabold shadow-xs transition ${
                          isLawyerActive
                            ? 'bg-amber-500 hover:bg-amber-600 text-slate-900'
                            : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                        }`}
                      >
                        {isLawyerActive ? 'Hide Profile (Go Inactive)' : 'Show Profile (Go Active)'}
                      </button>
                    </div>
                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    <div>
                      <label className="block text-slate-400 font-bold mb-1">Full Name</label>
                      <input 
                        type="text" 
                        disabled 
                        value={user.name} 
                        className="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-700 font-bold" 
                      />
                    </div>

                    <div>
                      <label className="block text-slate-400 font-bold mb-1">Email</label>
                      <input 
                        type="text" 
                        disabled 
                        value={user.email} 
                        className="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-700 font-bold" 
                      />
                    </div>

                    {user.role === 'lawyer' && (
                      <>
                        <div>
                          <label className="block text-slate-400 font-bold mb-1">Bar Council Registration</label>
                          <input 
                            type="text" 
                            disabled 
                            value={user.licenseNo || 'Verified Advocate'} 
                            className="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-700 font-bold" 
                          />
                        </div>

                        <div>
                          <label className="block text-slate-400 font-bold mb-1">Primary Court Chambers</label>
                          <input 
                            type="text" 
                            disabled 
                            value={user.court || 'High Court of Delhi'} 
                            className="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-700 font-bold" 
                          />
                        </div>

                        <div>
                          <label className="block text-slate-400 font-bold mb-1">Hourly Consultation Rate</label>
                          <input 
                            type="text" 
                            disabled 
                            value={`₹${user.hourly_rate || 2500} / hr`} 
                            className="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-700 font-bold" 
                          />
                        </div>

                        <div>
                          <label className="block text-slate-400 font-bold mb-1">Standing</label>
                          <input 
                            type="text" 
                            disabled 
                            value={`${user.experience_years || 8}+ Years Trial Practice`} 
                            className="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-700 font-bold" 
                          />
                        </div>
                      </>
                    )}
                  </div>
                </div>
              )}

              {tab === 'about' && (
                <div className="space-y-4 text-xs text-slate-600 leading-relaxed">
                  <h3 className="text-base font-bold text-slate-900">About Legal Advice Platform</h3>
                  <p>
                    Legal Advice is an enterprise legal portal connecting verified advocates with clients across High Courts and tribunals. 
                    Every legal counsel profile is backed by verified Bar Council admissions, courtroom experience metrics, and secure communication channels.
                  </p>
                </div>
              )}

              {tab === 'privacy' && (
                <div className="space-y-4 text-xs text-slate-600 leading-relaxed">
                  <h3 className="text-base font-bold text-slate-900">Attorney-Client Privilege</h3>
                  <p>
                    All communications, notes, and file exhibits deposited in this portal are protected under Section 126 of the Indian Evidence Act / Section 132 of Bharatiya Sakshya Adhiniyam.
                  </p>
                </div>
              )}

              {tab === 'contact' && (
                <div className="space-y-4 text-xs text-slate-600">
                  <h3 className="text-base font-bold text-slate-900">Privileged Hotline</h3>
                  <p>Urgent court filing or bail emergency: <strong>+91 (011) 2338-LEGAL</strong></p>
                  <p>Direct Registry Email: <strong>registrar@legaladvice.com</strong></p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: CATEGORY DETAIL MODAL
    // =========================================================================
    function CategoryDetailModal({ category, onClose, onFileCase }) {
      if (!category) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs animate-fadeIn">
          <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200">
            <div className="flex items-start justify-between pb-4 border-b border-slate-100">
              <div className="flex items-center gap-3">
                <span className="text-3xl p-2 bg-blue-50 border border-blue-100 rounded-2xl">{category.icon}</span>
                <div>
                  <h3 className="text-xl font-extrabold text-slate-900">{category.title}</h3>
                  <span className="text-[10px] font-bold uppercase tracking-wider text-blue-600">Statutory Practice Domain</span>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
            </div>

            <div className="my-6 space-y-4 text-xs">
              <div>
                <h4 className="font-bold text-slate-800 mb-1">Domain Scope & Procedural Relief</h4>
                <p className="text-slate-600 leading-relaxed">{category.fullDesc}</p>
              </div>

              <div>
                <h4 className="font-bold text-slate-800 mb-2">Key Court Proceedings</h4>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {category.services.map((srv, idx) => (
                    <div key={idx} className="p-2 rounded-xl bg-slate-50 border border-slate-100 font-semibold text-slate-700 flex items-center gap-1.5">
                      <span className="text-blue-500">✓</span> {srv}
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-4 border-t border-slate-100">
              <button onClick={onClose} className="px-4 py-2 font-bold text-slate-600 hover:bg-slate-100 rounded-xl text-xs">Close</button>
              <button onClick={onFileCase} className="px-5 py-2 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md text-xs">File Legal Case in this Domain</button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: FILE CASE MODAL
    // =========================================================================
    function FileCaseModal({ categories, lawyers, onClose, onSubmit }) {
      const [title, setTitle] = useState('');
      const [categorySlug, setCategorySlug] = useState(categories[0]?.slug || 'criminal-law');
      const [lawyerId, setLawyerId] = useState(lawyers[0]?.id || '');
      const [desc, setDesc] = useState('');
      const [priority, setPriority] = useState('Medium');

      const handleSubmit = (e) => {
        e.preventDefault();
        const selectedLawyer = lawyers.find(l => l.id === lawyerId);
        onSubmit({
          title,
          category_slug: categorySlug,
          lawyer_id: lawyerId,
          lawyer_name: selectedLawyer ? selectedLawyer.name : 'Unassigned',
          description: desc,
          priority
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs animate-fadeIn">
          <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200">
            <div className="flex items-start justify-between pb-4 border-b border-slate-100">
              <div>
                <h3 className="text-xl font-extrabold text-slate-900">File New Legal Matter</h3>
                <p className="text-xs text-slate-500">Initiate privileged petition docket</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
            </div>

            <form onSubmit={handleSubmit} className="my-6 space-y-4 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Docket / Petition Title</label>
                <input 
                  type="text" 
                  required 
                  placeholder="e.g. Anticipatory Bail Petition before Delhi High Court" 
                  value={title} 
                  onChange={e => setTitle(e.target.value)} 
                  className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600" 
                />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Statutory Practice Domain</label>
                <select 
                  value={categorySlug} 
                  onChange={e => setCategorySlug(e.target.value)} 
                  className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 font-semibold"
                >
                  {categories.map(c => <option key={c.slug} value={c.slug}>{c.title}</option>)}
                </select>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Case Facts & Relief Sought</label>
                <textarea 
                  required 
                  rows={3} 
                  placeholder="State the primary dispute facts, involved police station or court, and relief desired..." 
                  value={desc} 
                  onChange={e => setDesc(e.target.value)} 
                  className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600" 
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold text-slate-700 mb-1">Retain Advocate</label>
                  <select 
                    value={lawyerId} 
                    onChange={e => setLawyerId(e.target.value)} 
                    className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 font-semibold"
                  >
                    {lawyers.map(l => <option key={l.id} value={l.id}>{l.name} ({l.area_of_expertise})</option>)}
                  </select>
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">Urgency</label>
                  <select 
                    value={priority} 
                    onChange={e => setPriority(e.target.value)} 
                    className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 font-semibold"
                  >
                    <option value="Low">Low - Advisory</option>
                    <option value="Medium">Medium - Pending</option>
                    <option value="High">High - Impending Arrest / Hearing</option>
                  </select>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-4 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2 font-bold text-slate-600 hover:bg-slate-100 rounded-xl">Cancel</button>
                <button type="submit" className="px-5 py-2 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md">Submit Legal Filing</button>
              </div>
            </form>
          </div>
        </div>
      );
    }


    // =========================================================================
    // SECTION 7: WHATSAPP-STYLE REAL PROFILE EDIT MODAL
    // =========================================================================
    function ProfileEditModal({ user, onSave, onClose }) {
      const [name, setName] = useState(user.name || '');
      const [bio, setBio] = useState(user.bio || (user.profile ? user.profile.bio : '') || 'Available for legal consultation');
      const [avatarUrl, setAvatarUrl] = useState(user.avatar_url || (user.profile ? user.profile.avatar_url : '') || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200');
      const [court, setCourt] = useState(user.profile ? (user.profile.court || '') : '');
      const [licenseNo, setLicenseNo] = useState(user.profile ? (user.profile.license_no || '') : '');
      const [area, setArea] = useState(user.profile ? (user.profile.area_of_expertise || '') : '');
      const [isSaving, setIsSaving] = useState(false);
      const avatarInputRef = useRef(null);

      const isLawyer = user.role === 'lawyer';

      const handleAvatarFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setAvatarUrl(ev.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSaving(true);
        try {
          await onSave({
            name: name.trim(),
            bio: bio.trim(),
            avatar_url: avatarUrl,
            ...(isLawyer ? { court: court.trim(), licenseNo: licenseNo.trim(), area_of_expertise: area.trim() } : {})
          });
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <div className="flex flex-col max-h-[90vh]">
          {/* WhatsApp Dark Green Header */}
          <div className="bg-[#075E54] text-white px-5 py-4 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-3">
              <button 
                type="button" 
                onClick={onClose} 
                className="text-white hover:text-emerald-200 text-lg font-bold p-1 rounded-full hover:bg-white/10 transition"
              >
                ←
              </button>
              <h2 className="text-base font-bold">Profile</h2>
            </div>
            <button 
              type="button" 
              onClick={onClose} 
              className="text-white/80 hover:text-white text-xl font-bold p-1 rounded-full hover:bg-white/10 transition"
            >
              ✕
            </button>
          </div>

          <form onSubmit={handleSubmit} className="overflow-y-auto p-5 space-y-4 flex-1 bg-white">
            {/* Avatar Centered with Camera Icon */}
            <div className="flex flex-col items-center justify-center pt-2">
              <div className="relative group cursor-pointer" onClick={() => avatarInputRef.current && avatarInputRef.current.click()}>
                <img 
                  src={avatarUrl} 
                  alt={name} 
                  className="w-24 h-24 rounded-full object-cover border-4 border-slate-100 shadow-md group-hover:opacity-85 transition" 
                />
                <div className="absolute inset-0 rounded-full bg-black/40 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition text-white">
                  <span className="text-xl">📷</span>
                  <span className="text-[9px] font-bold uppercase mt-0.5">Upload</span>
                </div>
                <div className="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-[#25D366] text-white flex items-center justify-center shadow-lg border-2 border-white text-xs">
                  📷
                </div>
              </div>
              <input 
                ref={avatarInputRef} 
                type="file" 
                accept="image/*" 
                className="hidden" 
                onChange={handleAvatarFile} 
              />
              <div className="flex items-center gap-2 mt-2">
                <button
                  type="button"
                  onClick={() => avatarInputRef.current && avatarInputRef.current.click()}
                  className="text-[11px] font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-3 py-1 rounded-full border border-emerald-200 transition"
                >
                  📷 Choose From Device
                </button>
              </div>

              {/* Quick Preset Avatars */}
              <div className="w-full mt-3 p-2 bg-slate-50 rounded-2xl border border-slate-100">
                <span className="text-[10px] font-bold text-slate-500 block mb-1.5 text-center uppercase tracking-wide">Or Pick Instant Avatar</span>
                <div className="flex items-center justify-center gap-2 flex-wrap">
                  {[
                    'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200',
                    'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=200',
                    'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=200',
                    'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=200',
                    'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=200',
                    'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&q=80&w=200'
                  ].map((av, idx) => (
                    <img
                      key={idx}
                      src={av}
                      alt="Preset"
                      onClick={() => setAvatarUrl(av)}
                      className={`w-9 h-9 rounded-full object-cover cursor-pointer border-2 transition hover:scale-110 ${avatarUrl === av ? 'border-emerald-500 ring-2 ring-emerald-300' : 'border-white opacity-70 hover:opacity-100'}`}
                    />
                  ))}
                </div>
              </div>
            </div>

            {/* Name Section */}
            <div className="space-y-1">
              <label className="text-[11px] font-bold uppercase text-[#075E54] tracking-wider flex items-center gap-1.5">
                <span>👤</span> Your Name
              </label>
              <div className="relative">
                <input
                  type="text"
                  required
                  value={name}
                  onChange={e => setName(e.target.value)}
                  placeholder="Enter your name"
                  className="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#25D366] focus:outline-none font-semibold text-slate-800"
                />
                <span className="absolute right-3 top-2.5 text-slate-400 text-xs">✏️</span>
              </div>
              <p className="text-[10px] text-slate-400 px-1">This name will be visible to everyone you chat with on WhatsApp.</p>
            </div>

            {/* About / Bio Section */}
            <div className="space-y-1">
              <label className="text-[11px] font-bold uppercase text-[#075E54] tracking-wider flex items-center gap-1.5">
                <span>ℹ️</span> About / Status
              </label>
              <div className="relative">
                <input
                  type="text"
                  value={bio}
                  onChange={e => setBio(e.target.value)}
                  placeholder="Available for consultation..."
                  className="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#25D366] focus:outline-none text-slate-800"
                />
                <span className="absolute right-3 top-2.5 text-slate-400 text-xs">✏️</span>
              </div>
            </div>

            {/* Lawyer-specific fields */}
            {isLawyer && (
              <>
                <div className="space-y-1">
                  <label className="text-[11px] font-bold uppercase text-[#075E54] tracking-wider flex items-center gap-1.5">
                    <span>🏛️</span> Practice Court
                  </label>
                  <input
                    type="text"
                    value={court}
                    onChange={e => setCourt(e.target.value)}
                    placeholder="e.g. Supreme Court of India, High Court of Delhi"
                    className="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#25D366] focus:outline-none text-slate-800"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="space-y-1">
                    <label className="text-[11px] font-bold uppercase text-[#075E54] tracking-wider">Specialization</label>
                    <input
                      type="text"
                      value={area}
                      onChange={e => setArea(e.target.value)}
                      placeholder="Criminal, Civil, etc."
                      className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#25D366] focus:outline-none text-slate-800"
                    />
                  </div>
                  <div className="space-y-1">
                    <label className="text-[11px] font-bold uppercase text-[#075E54] tracking-wider">Bar License No.</label>
                    <input
                      type="text"
                      value={licenseNo}
                      onChange={e => setLicenseNo(e.target.value)}
                      placeholder="D/1482/2012"
                      className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#25D366] focus:outline-none text-slate-800"
                    />
                  </div>
                </div>
              </>
            )}

            {/* Registered Email (Read-only) */}
            <div className="space-y-1 pt-1 border-t border-slate-100">
              <label className="text-[11px] font-bold uppercase text-slate-400 tracking-wider">Registered Email</label>
              <div className="text-xs font-semibold text-slate-600 px-3 py-2 bg-slate-100 rounded-xl select-all">
                {user.email}
              </div>
            </div>

            {/* Save Buttons */}
            <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2 shrink-0">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition"
              >
                Cancel
              </button>
              <button
                type="submit"
                disabled={isSaving}
                className="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-[#075E54] hover:bg-[#064e46] shadow-md hover:shadow-lg transition flex items-center gap-1.5 disabled:opacity-50"
              >
                {isSaving ? 'Saving...' : 'Save Profile'}
              </button>
            </div>
          </form>
        </div>
      );
    }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
